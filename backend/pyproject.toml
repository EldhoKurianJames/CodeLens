[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/smoke_test.py"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, UP: pyupgrade,
# B: flake8-bugbear (common bug patterns).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by formatting preference, not a hard error
]

[tool.ruff.lint.per-file-ignores]
"sandbox_worker.py" = ["B018"]  # intentional bare-expression AST patterns
